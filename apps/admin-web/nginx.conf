server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # The API validates the PDF itself at 50 MiB. Leave room for multipart framing.
  client_max_body_size 55m;

  location /v1/ {
    proxy_pass http://knowledge-api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_buffering off;
    proxy_request_buffering off;
  }

  # pdf.js loads the Vite-built worker as an ES module. Alpine's default MIME
  # map does not include .mjs, so explicitly serve every built module as JS.
  location ~* \.mjs$ {
    default_type application/javascript;
    try_files $uri =404;
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
