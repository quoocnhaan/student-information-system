version: '3.8'

services:
  student-web:
    build:
      context: ../apps/student-web
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    restart: always

  enrollment-service:
    build:
      context: ../services/enrollment-service
      dockerfile: Dockerfile
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/enrollment_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-ptandat66}
      JWT_SECRET: ${JWT_SECRET:-DayLaMotSecretKeyRatDaiVaDuBaoMatChoViecTestRole123!}
      SPRING_PROFILES_ACTIVE: dev
    depends_on:
      - mysql
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8083/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ptandat66}
      MYSQL_DATABASE: enrollment_db
    volumes:
      - mysql-data:/var/lib/mysql
    restart: always

volumes:
  mysql-data:
