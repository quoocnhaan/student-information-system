spring.application.name=activity-service
server.port=8004

# ===============================
# Cấu hình MySQL DataSource
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3304/activity_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sis}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# Cấu hình Spring Data JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Cấu hình Swagger / OpenAPI UI
# ===============================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ===============================
# Cấu hình JWT Security
# ===============================
security.jwt.secret=${JWT_SECRET:c8f1e2d3b4a5968778695a4b3c2d1e0fa1b2c3d4e5f60718293a4b5c6d7e8f90}
security.jwt.expiration=${JWT_EXPIRATION:14400000}


