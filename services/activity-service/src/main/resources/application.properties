spring.application.name=activity-service
server.port=8080

# ===============================
# Cấu hình MySQL DataSource
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/mlearning_service?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=NewPassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# Cấu hình Spring Data JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Cấu hình Swagger / OpenAPI UI
# ===============================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
