services:
  surrealdb:
    image: surrealdb/surrealdb:v3.2.4
    # Local-only: root can initialise the Docker named volume at /data.
    user: "0:0"
    command: start --user ${SURREAL_USER:?Set SURREAL_USER in .env} --pass ${SURREAL_PASSWORD:?Set SURREAL_PASSWORD in .env} rocksdb:///data/database.db
    ports:
      - "8001:8000"
    volumes:
      - surreal_data:/data
    healthcheck:
      test: ["CMD", "/surreal", "is-ready", "--endpoint", "http://localhost:8000"]
      interval: 5s
      timeout: 3s
      retries: 12

  job-surrealdb:
    image: surrealdb/surrealdb:v3.2.4
    user: "0:0"
    command: start --user ${JOB_SURREAL_USER:?Set JOB_SURREAL_USER in .env} --pass ${JOB_SURREAL_PASSWORD:?Set JOB_SURREAL_PASSWORD in .env} rocksdb:///data/database.db
    ports:
      - "127.0.0.1:8002:8000"
    volumes:
      - job_surreal_data:/data
    healthcheck:
      test: ["CMD", "/surreal", "is-ready", "--endpoint", "http://localhost:8000"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-knowledge-assets}
    entrypoint: >-
      /bin/sh -c "until mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\"; do sleep 1; done;
      mc mb --ignore-existing local/$$MINIO_BUCKET"

  rabbitmq:
    image: rabbitmq:4.1-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6

  job-service:
    restart: unless-stopped
    build:
      context: ../../job-service
    environment:
      JOB_SURREAL_URL: ws://job-surrealdb:8000
      JOB_SURREAL_USER: ${JOB_SURREAL_USER:?Set JOB_SURREAL_USER in .env}
      JOB_SURREAL_PASSWORD: ${JOB_SURREAL_PASSWORD:?Set JOB_SURREAL_PASSWORD in .env}
      JOB_SURREAL_NAMESPACE: sis
      JOB_SURREAL_DATABASE: jobs
      JOB_RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
      JOB_WORKER_TOKEN: ${JOB_WORKER_TOKEN:?Set JOB_WORKER_TOKEN in .env}
      JOB_OWNER_TOKENS_JSON: ${JOB_OWNER_TOKENS_JSON:?Set JOB_OWNER_TOKENS_JSON in .env}
      JOB_REGISTERED_TYPES: ${JOB_REGISTERED_TYPES:-knowledge:ocr_pdf}
      JOB_REPLAY_BATCH_SIZE: ${JOB_REPLAY_BATCH_SIZE:-100}
    depends_on:
      job-surrealdb:
        condition: service_healthy
    ports:
      - "127.0.0.1:8010:8010"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/ready')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  knowledge-api:
    restart: unless-stopped
    build:
      context: .
    environment:
      KNOWLEDGE_ENVIRONMENT: development
      KNOWLEDGE_SURREAL_ENABLED: "true"
      KNOWLEDGE_SURREAL_APPLY_SCHEMA_ON_STARTUP: "true"
      SURREAL_URL: ws://surrealdb:8000
      SURREAL_USER: ${SURREAL_USER:?Set SURREAL_USER in .env}
      SURREAL_PASSWORD: ${SURREAL_PASSWORD:?Set SURREAL_PASSWORD in .env}
      SURREAL_NAMESPACE: ${SURREAL_NAMESPACE:-student_information}
      SURREAL_DATABASE: ${SURREAL_DATABASE:-knowledge}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-knowledge-assets}
      MINIO_SECURE: "false"
      # Docker reaches the LM Studio server running on the Windows host here.
      LMSTUDIO_BASE_URL: http://host.docker.internal:1234/v1
      LMSTUDIO_CHAT_MODEL: ${LMSTUDIO_CHAT_MODEL:-qwen2.5-14b-instruct}
      LMSTUDIO_EMBEDDING_MODEL: ${LMSTUDIO_EMBEDDING_MODEL:-text-embedding-nomic-embed-text-v1.5}
      KNOWLEDGE_OCR_MAX_PAGES: ${KNOWLEDGE_OCR_MAX_PAGES:-100}
      KNOWLEDGE_JOB_SERVICE_URL: http://job-service:8010
      KNOWLEDGE_JOB_SERVICE_OWNER_TOKEN: ${KNOWLEDGE_JOB_SERVICE_OWNER_TOKEN:?Set KNOWLEDGE_JOB_SERVICE_OWNER_TOKEN in .env}
      KNOWLEDGE_WORKER_CALLBACK_TOKEN: ${KNOWLEDGE_WORKER_CALLBACK_TOKEN:?Set KNOWLEDGE_WORKER_CALLBACK_TOKEN in .env}
      KNOWLEDGE_WEBSOCKET_AUTH_TOKEN: ${KNOWLEDGE_WEBSOCKET_AUTH_TOKEN:-}
    depends_on:
      surrealdb:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      job-service:
        condition: service_healthy
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/ready')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  worker-service:
    restart: unless-stopped
    build:
      context: ../../worker-service
    environment:
      WORKER_RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
      WORKER_JOB_SERVICE_URL: http://job-service:8010
      WORKER_JOB_TOKEN: ${JOB_WORKER_TOKEN:?Set JOB_WORKER_TOKEN in .env}
      WORKER_KNOWLEDGE_URL: http://knowledge-api:8000
      WORKER_KNOWLEDGE_TOKEN: ${KNOWLEDGE_WORKER_CALLBACK_TOKEN:?Set KNOWLEDGE_WORKER_CALLBACK_TOKEN in .env}
      WORKER_ENABLED_HANDLERS: ${WORKER_ENABLED_HANDLERS:-knowledge:ocr_pdf}
      WORKER_LMSTUDIO_BASE_URL: ${WORKER_LMSTUDIO_BASE_URL:-http://host.docker.internal:1234/v1}
      WORKER_LMSTUDIO_OCR_MODEL: ${LMSTUDIO_OCR_MODEL:-lightonocr-2-1b}
      WORKER_OCR_MAX_PAGES: ${KNOWLEDGE_OCR_MAX_PAGES:-100}
      WORKER_OCR_MAX_OUTPUT_TOKENS: ${KNOWLEDGE_OCR_MAX_OUTPUT_TOKENS:-4096}
      WORKER_OCR_TIMEOUT_SECONDS: ${KNOWLEDGE_OCR_TIMEOUT_SECONDS:-60}
    depends_on:
      rabbitmq:
        condition: service_healthy
      job-service:
        condition: service_healthy
      knowledge-api:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stop_grace_period: 5m

  knowledge-orphan-cleanup:
    profiles: ["maintenance"]
    build:
      context: .
    command: python -m app.orphan_cleanup
    environment:
      KNOWLEDGE_SURREAL_ENABLED: "true"
      SURREAL_URL: ws://surrealdb:8000
      SURREAL_USER: ${SURREAL_USER:?Set SURREAL_USER in .env}
      SURREAL_PASSWORD: ${SURREAL_PASSWORD:?Set SURREAL_PASSWORD in .env}
      SURREAL_NAMESPACE: ${SURREAL_NAMESPACE:-student_information}
      SURREAL_DATABASE: ${SURREAL_DATABASE:-knowledge}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-knowledge-assets}
      MINIO_SECURE: "false"
      KNOWLEDGE_ORPHAN_CLEANUP_ENABLED: ${KNOWLEDGE_ORPHAN_CLEANUP_ENABLED:-false}
      KNOWLEDGE_ORPHAN_CLEANUP_DRY_RUN: ${KNOWLEDGE_ORPHAN_CLEANUP_DRY_RUN:-true}
      KNOWLEDGE_ORPHAN_CLEANUP_GRACE_SECONDS: ${KNOWLEDGE_ORPHAN_CLEANUP_GRACE_SECONDS:-86400}
      KNOWLEDGE_ORPHAN_CLEANUP_INTERVAL_SECONDS: ${KNOWLEDGE_ORPHAN_CLEANUP_INTERVAL_SECONDS:-3600}
      KNOWLEDGE_JOB_SERVICE_URL: http://job-service:8010
      KNOWLEDGE_JOB_SERVICE_OWNER_TOKEN: ${KNOWLEDGE_JOB_SERVICE_OWNER_TOKEN:?Set KNOWLEDGE_JOB_SERVICE_OWNER_TOKEN in .env}
    depends_on:
      surrealdb:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      job-service:
        condition: service_healthy

  admin-web:
    build:
      context: ../../../apps/admin-web
    depends_on:
      knowledge-api:
        condition: service_healthy
    ports:
      - "${ADMIN_WEB_PORT:-5173}:80"

volumes:
  surreal_data:
  job_surreal_data:
  minio_data:
  rabbitmq_data:
