[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "student-information-system-knowledge"
version = "0.1.0"
description = "Knowledge retrieval API for the Student Information System"
requires-python = ">=3.12"
dependencies = [
  "aio-pika>=9.5,<10.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "minio>=7.2,<8.0",
  "pillow>=10.4,<12.0",
  "pydantic-settings>=2.6,<3.0",
  "pypdfium2>=4.30,<5.0",
  "python-multipart>=0.0.20,<1.0",
  "prometheus-client>=0.21,<1.0",
  "surrealdb>=2.0,<3.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
