[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "student-information-system-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["aio-pika>=9.5,<10", "httpx>=0.27,<1", "pydantic-settings>=2.6,<3", "pypdfium2>=4.30,<5", "pillow>=10.4,<12", "anyio>=4,<5"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/worker_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
