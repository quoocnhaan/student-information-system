spring.application.name=academic-service

# ==== Datasource ====
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3303/academic_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sis}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==== JPA / Hibernate ====
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

server.port=8003

# ==== Swagger / OpenAPI UI ====
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ==== JWT Security ====
security.jwt.secret=${JWT_SECRET:c8f1e2d3b4a5968778695a4b3c2d1e0fa1b2c3d4e5f60718293a4b5c6d7e8f90}
security.jwt.expiration=${JWT_EXPIRATION:14400000}

# ==== Eureka Client ====
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}:${random.value}


