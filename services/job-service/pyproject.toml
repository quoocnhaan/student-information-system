[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "student-information-system-jobs"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.32,<1", "surrealdb>=2,<3", "aio-pika>=9.5,<10", "pydantic-settings>=2.6,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "httpx>=0.27,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/job_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
