services:
  mysqldb:
    image: mysql:8.0
    container_name: sis_mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3301:3306"
    volumes:
      - ./academic_activity.sql:/docker-entrypoint-initdb.d/academic_activity.sql
      - mysql_data:/var/lib/mysql
    networks:
      - sis_network

  academic-service:
    build:
      context: ./services/academic-service
    container_name: academic_service_app
    ports:
      - "8080:8080"
    depends_on:
      - mysqldb
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysqldb:3306/academic_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    networks:
      - sis_network

  activity-service:
    build:
      context: ./services/activity-service 
    container_name: activity_service_app
    ports:
      - "8081:8080"
    depends_on:
      - mysqldb
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysqldb:3306/activity_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    networks:
      - sis_network

volumes:
  mysql_data:

networks:
  sis_network:
    driver: bridge 

